name: Bug report
description: Report reproducible Cioppino behavior using sanitized information
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include credentials, private transcripts,
        databases, environment files, personal paths, or confidential third-party data.
  - type: input
    id: version
    attributes:
      label: Cioppino version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Other or unsupported
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v24.x.x
    validations:
      required: true
  - type: input
    id: affected-agent
    attributes:
      label: Affected agent or integration
      placeholder: GitHub Copilot CLI
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
      description: Use synthetic data and replace usernames, project names, URLs, and paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, transcripts, databases, private URLs, and personal paths.
          required: true
        - label: This report is not a security vulnerability.
          required: true
