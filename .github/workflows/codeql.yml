name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 7 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  availability:
    name: CodeQL availability
    runs-on: ubuntu-latest
    steps:
      - name: Report repository support
        shell: bash
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "Code scanning is unavailable for this private repository."
            echo "CodeQL analysis will start automatically if the repository becomes public."
          else
            echo "Code scanning is available."
          fi

  analyze:
    if: github.event.repository.private == false
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
